name: Build Nexrify APK

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build Nexrify APK (Optimized Release & Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode keystore (opsional, dari GitHub Secrets)
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXRIFY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/nexrify.keystore" 2>/dev/null; then
            echo "NEXRIFY_STORE_FILE=$RUNNER_TEMP/nexrify.keystore" >> "$GITHUB_ENV"
            echo "Keystore ditemukan, APK release akan ditandatangani."
          else
            echo "::warning::Keystore tidak valid atau kosong, release memakai tanda tangan debug."
          fi

      - name: Build Release & Debug APKs
        env:
          NEXRIFY_STORE_PASSWORD: ${{ secrets.NEXRIFY_STORE_PASSWORD }}
          NEXRIFY_KEY_ALIAS: ${{ secrets.NEXRIFY_KEY_ALIAS }}
          NEXRIFY_KEY_PASSWORD: ${{ secrets.NEXRIFY_KEY_PASSWORD }}
        run: ./gradlew assembleRelease assembleDebug --stacktrace

      - name: Upload Release APK (Optimized R8)
        uses: actions/upload-artifact@v4
        with:
          name: Nexrify-Music-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Nexrify-Music-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Publish GitHub Release (saat tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
